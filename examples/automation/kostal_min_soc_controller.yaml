alias: Kostal min SoC Controller
description: "Controls the minimum SoC of the Kostal inverter based on EMHASS targets and protects the home battery during Wallbox EV charging only when insufficient PV power or forecast is available."
triggers:
  - trigger: state
    entity_id:
      - input_select.pv_battery_emhass_status
    for:
      seconds: 3
  - trigger: state
    entity_id:
      - input_select.wallbox_emhass_status
    for:
      seconds: 3
  - trigger: state
    entity_id:
      - select.goe_297534_lmo
    for:
      seconds: 3
  - trigger: state
    entity_id:
      - sensor.soc_batt_forecast
    for:
      seconds: 5
  - trigger: state
    entity_id:
      - sensor.scb_battery_soc
    for:
      seconds: 5
  - trigger: state
    entity_id:
      - sensor.scb_dc1_power
      - sensor.scb_dc2_power
    for:
      seconds: 15
  - trigger: state
    entity_id:
      - sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute
    for:
      seconds: 15
conditions: []
actions:
  - variables:
      # --- Configurable thresholds for Wallbox battery support ---
      # Minimum solar power (W) above which home battery may support the Wallbox in surplus mode:
      min_pv_power_threshold: 1500
      # Remaining PV forecast for today (kWh) above which surplus support is permitted:
      min_remaining_pv_kwh: 3.0
      # Wallbox logic mode: 4 = Eco / PV Surplus, 3 = Default / Scheduled
      is_surplus_mode: "{{ is_state('select.goe_297534_lmo', '4') }}"

      # Current battery SoC and inverter minimum SoC setting
      current_soc: "{{ states('sensor.scb_battery_soc') | int(10) }}"
      current_min_setting: "{{ states('number.scb_battery_min_soc') | int(10) }}"

      # Real PV generation (DC1 + DC2 strings):
      # Note: On Kostal Plenticore with battery on DC3, sensor.scb_solar_power includes battery discharge power!
      # We must sum DC1 and DC2 directly to get actual solar production:
      pv_power: "{{ (states('sensor.scb_dc1_power') | float(0.0)) + (states('sensor.scb_dc2_power') | float(0.0)) }}"

      # Daily forecast values
      solcast_remaining_today: "{{ states('sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute') | float(0.0) }}"
      pv_forecast_24h: "{{ (state_attr('sensor.p_pv_forecast', 'forecasts') | default([], true) | map(attribute='p_pv_forecast') | map('float', 0.0) | sum) * 0.25 }}"
      load_forecast_24h: "{{ (state_attr('sensor.p_load_forecast', 'forecasts') | default([], true) | map(attribute='p_load_forecast') | map('float', 0.0) | sum) * 0.25 }}"

      # EMHASS planned target battery SoC (sensor.soc_batt_forecast):
      emhass_target_soc: "{{ states('sensor.soc_batt_forecast') | float(current_soc) }}"

  # Compute derived condition in a separate variables step to ensure inputs are resolved
  - variables:
      # Battery recovery hysteresis:
      # When battery drops to <= 10%, it must recover above 20% before it may discharge to 10% again.
      is_battery_recovering: >-
        {{ current_soc <= 10 or (current_min_setting >= 20 and current_soc <= 20) }}
      base_min_soc: >-
        {{ 20 if (current_soc <= 10 or (current_min_setting >= 20 and current_soc <= 20)) else 10 }}

      # Lower bound (SoC %) down to which the battery may discharge into the car when PV forecast is sufficient:
      wallbox_allowed_min_soc: >-
        {{ 20 if (current_soc <= 10 or (current_min_setting >= 20 and current_soc <= 20)) else 10 }}

      # In PV surplus mode: allow battery buffering only if real PV generation AND forecast are both sufficient
      has_enough_pv: >-
        {{ pv_power >= min_pv_power_threshold and
           solcast_remaining_today >= min_remaining_pv_kwh }}

      # EMHASS planned target battery SoC:
      # Clamped between base_min_soc and 90%, rounded up to 5% increments
      emhass_calc_soc: >-
        {% set b_min = 20 if (current_soc <= 10 or (current_min_setting >= 20 and current_soc <= 20)) else 10 %}
        {{ [b_min, [((emhass_target_soc / 5) | round(0, 'ceil') * 5) | int(b_min), 90] | min] | max }}

  - choose:
      # Case 1: EMHASS grid charging active for home battery
      - conditions:
          - condition: state
            entity_id: input_select.pv_battery_emhass_status
            state:
              - running
              - force
        sequence:
          - action: number.set_value
            target:
              entity_id: number.scb_battery_min_soc
            data:
              value: "{{ emhass_calc_soc }}"

      # Case 2: EV charging at Wallbox
      - conditions:
          - condition: state
            entity_id: input_select.wallbox_emhass_status
            state:
              - running
              - force
              - force-6
              - force-10
              - force-12
              - force-14
              - force-16
        sequence:
          - choose:
              # Case 2a: PV Surplus Mode (lmo == 4)
              # Allow battery to buffer minor dips only if real solar generation and forecast are sufficient
              - conditions:
                  - condition: template
                    value_template: "{{ is_surplus_mode }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ has_enough_pv }}"
                        sequence:
                          - action: number.set_value
                            target:
                              entity_id: number.scb_battery_min_soc
                            data:
                              value: "{{ wallbox_allowed_min_soc }}"
                    default:
                      - variables:
                          protect_soc: >-
                            {% set rounded_current = ((current_soc / 5) | round(0, 'ceil') * 5) | int(base_min_soc) %}
                            {{ [base_min_soc, [rounded_current, 90] | min] | max }}
                      - action: number.set_value
                        target:
                          entity_id: number.scb_battery_min_soc
                        data:
                          value: "{{ protect_soc }}"

              # Case 2b: EMHASS Scheduled Charging / Grid Mode (lmo != 4)
              # Align with EMHASS cost-optimized schedule:
              # Set min_soc to the forecasted target SoC so the battery is not drained into the car
              # when EMHASS planned grid charging or battery reservation for peak hours.
              - conditions:
                  - condition: template
                    value_template: "{{ not is_surplus_mode }}"
                sequence:
                  - action: number.set_value
                    target:
                      entity_id: number.scb_battery_min_soc
                    data:
                      value: "{{ emhass_calc_soc }}"

    # Default (neither grid charging nor Wallbox active): reset to base value (10% or 20% if recovering)
    default:
      - action: number.set_value
        target:
          entity_id: number.scb_battery_min_soc
        data:
          value: "{{ base_min_soc }}"

  # Always ensure Kostal usage mode is set to None
  - action: select.select_option
    target:
      entity_id: select.battery_charging_usage_mode
    data:
      option: "None"
mode: restart
