alias: Stefan
description: ""
use_blueprint:
  path: room_control.yaml
  input:
    present_entity:
      - person.lukas
      - person.simon
    window_entity:
      - binary_sensor.fenster_4
    blind_entity:
      - cover.stefan_rolladen
    heating_entity:
      - climate.stefan_antrieb
    blind_allow_opening_at_home: true
    blind_open_earliest: "06:33:00"
    blind_open_offset_time:
      hours: 0
      minutes: 3
      seconds: 0
    blind_close_offset_time:
      hours: 0
      minutes: 23
      seconds: 0
    blind_close_latest: "21:33:00"
    blind_setup: default
    blind_shading_template: |-
      {% set temp_inside = state_attr('climate.stefan_thermostat', 'current_temperature') | float(0) %}
      {% set temp_outside = [states('sensor.thermometer_garden_temperatur') | float(0),
                            states('sensor.motion_detector_outside_hue_temperatur') | float(0)] | max %}
      {% set lx_outside = states('sensor.motion_detector_outside_hue_beleuchtungsstarke') | float(0) %}
      {{
        temp_outside > temp_inside and
        today_at('11:00') <= now() <= today_at('22:00') and
        (temp_inside >= 20 or lx_outside >= 10000)
      }}
    blind_pos_shading: 40
