                        {% endif %};
                      }
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: binary_sensor.goe_297534_car_0
                state: 'on'
        column_span: 2
      - type: grid
        cards:
          - camera_view: live
            fit_mode: fill
            type: picture-glance
            title: Eingang
            entities: []
            camera_image: camera.entryway
            tap_action:
              action: none
          - camera_view: live
            fit_mode: fill
            type: picture-glance
            title: Terrasse
            entities: []
            camera_image: camera.backyard
            tap_action:
              action: none
        column_span: 2
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.scb_battery_soc
                name: Batterie
                unit: '%'
                min: 5
                max: 100
                needle: false
                severity:
                  green: 60
                  yellow: 50
                  red: 0
                tap_action:
                  action: none
              - type: gauge
                entity: sensor.scb_home_power_from_grid
                unit: W
                max: 30000
                severity:
                  green: 0
                  yellow: 1500
                  red: 3000
                tap_action:
                  action: none
                min: 0
                name: Bezug
              - type: gauge
                entity: sensor.scb_sum_power_of_all_pv_dc_inputs
                min: 0
                max: 12000
                severity:
                  green: 6000
                  yellow: 4000
                  red: 0
                tap_action:
                  action: none
                name: PV Strom
            grid_options:
              columns: full
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.scb_home_power
                name: Verbrauch
                min: 0
                max: 20000
                severity:
                  green: 0
                  yellow: 4000
                  red: 6000
                tap_action:
                  action: none
              - type: gauge
                entity: sensor.tibber27a_strompreis
                name: Preis
                severity:
                  green: -0.5
                  yellow: 0.285
                  red: 0.4
                min: -0.5
                max: 1
                tap_action:
                  action: none
              - type: gauge
                min: 0
                severity:
                  green: 90
                  yellow: 50
                  red: 0
                tap_action:
                  action: none
                entity: sensor.scb_autarky_day
                name: Autark
                unit: '%'
                max: 100
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 5
            header:
              show: true
              title: Energie-Monitor (±12h)
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: hour
              offset: '-12h'
            now:
              show: true
              label: Jetzt
              color: red
            apex_config:
              chart:
                height: 265px
              forceNiceScale: true
            yaxis:
              - id: power
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: Leistung (W)
              - id: price
                opposite: true
                decimals: 3
                apex_config:
                  title:
                    text: Preis (€)
            series:
              - entity: sensor.tibber_rohdaten_cache
                name: Strompreis
                yaxis_id: price
                type: line
                stroke_width: 1.5
                color: '#e74c3c'
                float_precision: 3
                show:
                  legend_value: false
                  in_header: false
                data_generator: |
                  let prices = entity.attributes.price_data;
                  return prices.map(item => {
                    return [new Date(item.start_time).getTime(), item.price];
                  });
              - entity: sensor.scb_sum_power_of_all_pv_dc_inputs
                name: PV Erzeugung
                yaxis_id: power
                type: area
                color: '#ffc107'
                opacity: 0.4
                stroke_width: 1
                extend_to: now
                group_by:
                  func: avg
                  duration: 30min
                show:
                  legend_value: false
                  in_header: false
              - entity: sensor.scb_home_power
                name: Verbrauch
                yaxis_id: power
                type: line
                color: '#3498db'
                stroke_width: 2
                extend_to: now
                group_by:
                  func: avg
                  duration: 30min
                show:
                  legend_value: false
                  in_header: false
              - entity: sensor.solcast_pv_forecast_prognose_heute
                name: PV Forecast
                yaxis_id: power
                type: line
                stroke_width: 2
                color: '#ffffff'
                stroke_dash:
                  - 4
                show:
                  legend_value: false
                  in_header: false
                data_generator: >
                  var today = entity.attributes.detailedForecast || [];

                  var tomorrowState =
                  hass.states['sensor.solcast_pv_forecast_prognose_morgen'];

                  var tomorrow = tomorrowState ?
                  tomorrowState.attributes.detailedForecast : [];

                  var allData = today.concat(tomorrow);

                  return allData.map(item => {
                    return [new Date(item.period_start).getTime(), item.pv_estimate * 1000];
                  });
          - show_current: true
            show_forecast: true
            type: weather-forecast
            entity: weather.forecast_home_2
            forecast_type: hourly
            grid_options:
              columns: full
              rows: 3
            forecast_slots: 8
        column_span: 2
      - type: grid
        cards:
          - type: tile
            entity: person.tanja
            show_entity_picture: true
            features_position: bottom
            vertical: true
            tap_action:
              action: none
            icon_tap_action:
              action: none
            grid_options:
              columns: 3
              rows: 2
          - type: tile
