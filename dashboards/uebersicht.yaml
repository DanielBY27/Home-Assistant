                    :host {
                      --card-mod-icon-color:
                        {% if states('input_select.wallbox_emhass_status') == "force-14" %}
                          green
                        {% else %}
                          var(--primary-text-color)
                        {% endif %};
                      }
              - show_name: true
                show_icon: true
                type: button
                entity: input_select.wallbox_emhass_status
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.wallbox_emhass_status
                  data:
                    option: force-16
                icon: mdi:battery-charging-90
                name: 16 A
                show_state: false
                icon_height: 50px
                grid_options:
                  columns: 3
                  rows: 2
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        {% if states('input_select.wallbox_emhass_status') == "force-16" %}
                          green
                        {% else %}
