views:
  - type: sections
    path: verview
    max_columns: 2
    title: Übersicht
    sections:
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.abholung_restmull
                below: 4
            card:
              type: tile
              entity: sensor.abholung_restmull
              name: Rest/Bio
              icon: mdi:trash-can
              color: deep-orange
              state_content: state
              vertical: false
              tap_action:
                action: none
              features_position: bottom
            grid_options:
              columns: 6
              rows: auto
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.abholung_papier
                below: 4
            card:
              type: tile
              entity: sensor.abholung_papier
              name: Papier
              icon: mdi:trash-can
              color: blue
              state_content: state
              vertical: false
              tap_action:
                action: none
              features_position: bottom
            grid_options:
              columns: 6
              rows: auto
          - type: horizontal-stack
            cards:
              - show_name: true
                show_icon: true
                type: button
                entity: input_select.wallbox_emhass_status
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.wallbox_emhass_status
                  data:
                    option: running
                icon: mdi:battery-charging-20
                name: Eco
                show_state: false
                grid_options:
                  columns: 3
                  rows: 2
                icon_height: 50px
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        {% if states('input_select.wallbox_emhass_status') == "wait" %}
                          yellow
                        {% elif states('input_select.wallbox_emhass_status') == "running" %}
                          green
                        {% elif states('input_select.wallbox_emhass_status') == "done" %}
                          #03a9f4
                        {% else %}
                          var(--primary-text-color)
                        {% endif %};
                      }
              - show_name: true
                show_icon: true
                type: button
                entity: input_select.wallbox_emhass_status
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.wallbox_emhass_status
                  data:
                    option: force-6
                icon: mdi:battery-charging-30
                name: 6 A
                show_state: false
                icon_height: 50px
                grid_options:
                  columns: 3
                  rows: 2
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        {% if states('input_select.wallbox_emhass_status') in ['force', 'force-6'] %}
                          green
                        {% else %}
                          var(--primary-text-color)
                        {% endif %};
                      }

              - show_name: true
                show_icon: true
                type: button
                entity: input_select.wallbox_emhass_status
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.wallbox_emhass_status
                  data:
                    option: force-10
                icon: mdi:battery-charging-40
                name: 10 A
                show_state: false
                icon_height: 50px
                grid_options:
                  columns: 3
                  rows: 2
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        {% if states('input_select.wallbox_emhass_status') == "force-10" %}
                          green
                        {% else %}
                          var(--primary-text-color)
                        {% endif %};
                      }
              - show_name: true
                show_icon: true
                type: button
                entity: input_select.wallbox_emhass_status
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.wallbox_emhass_status
                  data:
                    option: force-12
                icon: mdi:battery-charging-60
                name: 12 A
                show_state: false
                icon_height: 50px
                grid_options:
                  columns: 3
                  rows: 2
                card_mod:
                  style: |
                    :host {
