              rows: 2
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: sun.sun
                secondary_info: none
              - entity: sensor.sun_next_dawn
                name: Morgendämmerung
                secondary_info: none
              - entity: sensor.sun_next_rising
                name: Aufgang
                secondary_info: none
              - entity: sensor.sun_next_noon
                name: Höchstand
                secondary_info: none
              - entity: sensor.sun_next_setting
                secondary_info: none
                name: Untergang
              - entity: sensor.sun_next_dusk
                secondary_info: none
                name: Abenddämmerung
            state_color: true
        column_span: 1
