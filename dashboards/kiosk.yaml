          };

          window._kioskOpenBatteryModal = () => {
            const old = document.getElementById('kiosk-modal-overlay');
            if (old) {
              if (old._closeHandler) old._closeHandler();
              else old.remove();
            }

            const h = window._kioskLatestHass || hass;
            const stMap = (h && h.states) ? h.states : states;
            let lowCount = 0;
            let unavailCount = 0;
            let okBinCount = 0;
            const lowBinItems = [];
            const unavailItems = [];
            const numericSensors = [];
            const okBinItems = [];

            const cleanName = (s, id) => {
              let n = (s.attributes && s.attributes.friendly_name) ? s.attributes.friendly_name : id;
              return n.replace(/ Batterie$/i, '').replace(/ Battery Level$/i, '').replace(/ Battery$/i, '');
            };

            Object.keys(stMap).forEach((id) => {
              if (excludeIds.has(id) || id.startsWith('sensor.sun2000') || id.startsWith('sensor.battery_state_of_capacity')) return;
              const s = stMap[id];
              if (!s || !s.attributes || s.attributes.device_class !== 'battery') return;
              const fname = cleanName(s, id);
              if (id.startsWith('sensor.')) {
                if (s.state === 'unavailable' || s.state === 'unknown') {
                  unavailCount++;
                  unavailItems.push({ name: fname, id, state: s.state });
                } else {
                  const v = parseFloat(s.state);
                  if (!isNaN(v)) {
                    if (v <= 20) lowCount++;
                    numericSensors.push({ name: fname, id, val: v });
                  }
                }
              } else if (id.startsWith('binary_sensor.')) {
                if (s.state === 'on') {
                  lowCount++;
                  lowBinItems.push({ name: fname, id });
                } else if (s.state === 'unavailable' || s.state === 'unknown') {
                  unavailCount++;
                  unavailItems.push({ name: fname, id, state: s.state });
                } else if (s.state === 'off') {
                  okBinCount++;
                  okBinItems.push({ name: fname, id });
                }
              }
            });

            numericSensors.sort((a, b) => a.val - b.val);
            const totalAlerts = lowCount + unavailCount;

            const overlay = document.createElement('div');
            overlay.id = 'kiosk-modal-overlay';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:kioskFadeIn 0.16s ease-out;';

            const modal = document.createElement('div');
            modal.style.cssText = 'width:84vw;max-width:760px;max-height:86vh;background:var(--card-background-color, #1c1c1e);color:var(--primary-text-color, #ffffff);border-radius:24px;border:1px solid var(--divider-color, rgba(128,128,128,0.3));box-shadow:0 24px 64px rgba(0,0,0,0.65);display:flex;flex-direction:column;overflow:hidden;';
            modal.addEventListener('click', (e) => e.stopPropagation());
            const closeModal = () => overlay.remove();
            overlay.addEventListener('click', closeModal);

            const header = document.createElement('div');
            header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--divider-color, rgba(128,128,128,0.2));background:var(--secondary-background-color, rgba(128,128,128,0.08));';
            const battIcon = totalAlerts > 0 ? 'mdi:battery-alert-variant-outline' : 'mdi:battery-check-outline';
            header.innerHTML = `
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:42px;height:42px;border-radius:12px;background:${totalAlerts > 0 ? 'rgba(255,152,0,0.18)' : 'rgba(76,175,80,0.16)'};display:flex;align-items:center;justify-content:center;color:${totalAlerts > 0 ? '#ff9800' : '#4caf50'};">
                  <ha-icon icon="${battIcon}" style="--mdc-icon-size:24px;"></ha-icon>
                </div>
                <div>
                  <div style="font-size:18px;font-weight:700;">Batterie-Status & Gerätewartung</div>
                  <div style="font-size:12px;color:var(--secondary-text-color);">${lowCount} schwach (&le; 20%) &bull; ${unavailCount} nicht erreichbar &bull; ${numericSensors.length} %-Sensoren &bull; ${okBinCount} Homematic OK</div>
                </div>
              </div>
            `;
            const closeBtn = document.createElement('button');
            closeBtn.style.cssText = 'width:38px;height:38px;border-radius:50%;border:1px solid var(--divider-color, rgba(128,128,128,0.3));background:var(--card-background-color);color:var(--primary-text-color);display:flex;align-items:center;justify-content:center;cursor:pointer;';
            closeBtn.innerHTML = '<ha-icon icon="mdi:close" style="--mdc-icon-size:20px;"></ha-icon>';
            closeBtn.addEventListener('click', closeModal);
            header.appendChild(closeBtn);

            const body = document.createElement('div');
            body.style.cssText = 'padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;';

            if (lowBinItems.length > 0 || unavailItems.length > 0) {
              const warnWrap = document.createElement('div');
              const warnCards = [
                ...lowBinItems.map((item) => `
                  <div style="padding:10px 12px;border-radius:12px;background:rgba(244,67,54,0.14);border:1px solid #f44336;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;">
                    <span>${item.name}</span>
                    <span style="color:#f44336;">BATTERIE LEER</span>
                  </div>
                `),
                ...unavailItems.map((item) => `
                  <div style="padding:10px 12px;border-radius:12px;background:rgba(255,152,0,0.14);border:1px solid rgba(255,152,0,0.6);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;">
                    <span>${item.name}</span>
                    <span style="color:#ff9800;">NICHT ERREICHBAR</span>
                  </div>
                `)
              ].join('');
              warnWrap.innerHTML = `
                <div style="font-size:13px;font-weight:700;color:#ff9800;margin-bottom:8px;">Zu prüfen – Schwache Batterie oder Gerät nicht erreichbar (${lowBinItems.length + unavailItems.length}):</div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:8px;">
                  ${warnCards}
                </div>
              `;
              body.appendChild(warnWrap);
            }

            const numWrap = document.createElement('div');
            const numRows = numericSensors.map((s) => {
              const color = s.val <= 20 ? '#f44336' : (s.val <= 40 ? '#ff9800' : '#4caf50');
              const icon = s.val <= 15 ? 'mdi:battery-10' : (s.val <= 35 ? 'mdi:battery-30' : (s.val <= 65 ? 'mdi:battery-60' : (s.val <= 90 ? 'mdi:battery-80' : 'mdi:battery')));
              return `
                <div style="padding:10px 14px;border-radius:12px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));display:flex;flex-direction:column;gap:6px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;">
                    <div style="display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                      <ha-icon icon="${icon}" style="color:${color};--mdc-icon-size:18px;flex-shrink:0;"></ha-icon>
                      <span style="overflow:hidden;text-overflow:ellipsis;">${s.name}</span>
                    </div>
                    <span style="font-weight:700;color:${color};margin-left:8px;">${Math.round(s.val)} %</span>
                  </div>
                  <div style="width:100%;height:5px;border-radius:3px;background:rgba(128,128,128,0.2);overflow:hidden;">
                    <div style="width:${Math.max(0, Math.min(100, s.val))}%;height:100%;background:${color};border-radius:3px;"></div>
                  </div>
                </div>
              `;
            }).join('');
            numWrap.innerHTML = `
              <div style="font-size:13px;font-weight:700;color:var(--secondary-text-color);margin-bottom:8px;">Alle Batterie-Sensoren mit Ladezustand (${numericSensors.length}):</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:8px;">
                ${numRows}
              </div>
            `;
            body.appendChild(numWrap);

            if (okBinItems.length > 0) {
              const okWrap = document.createElement('div');
              const okPills = okBinItems.map((item) => `
                <div style="padding:7px 10px;border-radius:10px;background:rgba(76,175,80,0.08);border:1px solid rgba(76,175,80,0.25);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.name}</span>
                  <span style="color:#4caf50;margin-left:6px;">OK</span>
                </div>
              `).join('');
              okWrap.innerHTML = `
                <div style="font-size:13px;font-weight:700;color:var(--secondary-text-color);margin-bottom:8px;">Homematic IP Binär-Batteriesensoren (${okBinCount} OK):</div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));gap:6px;">
                  ${okPills}
                </div>
              `;
              body.appendChild(okWrap);
            }

            const linkRow = document.createElement('div');
            linkRow.style.cssText = 'display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:4px;';

            const navBtn = document.createElement('button');
            navBtn.style.cssText = 'display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:none;background:var(--primary-color, #03a9f4);color:#ffffff;font-size:13px;font-weight:700;cursor:pointer;';
            navBtn.innerHTML = '<ha-icon icon="mdi:wrench-clock" style="--mdc-icon-size:18px;"></ha-icon><span>Zur Wartungsübersicht (/maintenance)</span>';
            navBtn.addEventListener('click', () => {
              overlay.remove();
              window.history.pushState(null, '', '/maintenance');
              window.dispatchEvent(new Event('location-changed'));
            });
            linkRow.appendChild(navBtn);

            body.appendChild(linkRow);
            modal.appendChild(header);
            modal.appendChild(body);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
          };

          const ccuStyle = ccuCount > 0
            ? 'border:1.5px solid #f44336;background:rgba(244,67,54,0.14);'
            : '';
          const ccuIconColor = ccuCount > 0 ? '#f44336' : 'var(--secondary-text-color)';

          const battStyle = alertBatteryCount > 0
            ? 'border:1.5px solid #ff9800;background:rgba(255,152,0,0.14);'
            : '';
          const battIconColor = alertBatteryCount > 0 ? '#ff9800' : '#4caf50';
          const battIcon = alertBatteryCount > 0 ? 'mdi:battery-alert-variant-outline' : 'mdi:battery-check-outline';

          const now = new Date();
          const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

          setTimeout(() => {
            if (!this || !this.shadowRoot) return;
            if (!this._clockInterval) {
              this._clockInterval = setInterval(() => {
                if (!this.isConnected || !this.shadowRoot) {
                  clearInterval(this._clockInterval);
                  this._clockInterval = null;
                  return;
                }
                const el = this.shadowRoot.querySelector('.kiosk-live-clock-text');
                if (el) {
                  el.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                }
              }, 1000);
            }
          }, 40);

          return `
            <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
                <div class="kiosk-chip-ccu"
                     onpointerdown="window._kioskLastChip='ccu';window._kioskLastChipTs=Date.now();"
                     onclick="event.stopPropagation();if(window._kioskOpenCcuModal)window._kioskOpenCcuModal();"
                     style="${chipStyle}cursor:pointer;${ccuStyle}"
                     title="Homematic CCU Servicemeldungen anzeigen">
                  <ha-icon icon="mdi:alert-circle-outline" style="--mdc-icon-size:16px;color:${ccuIconColor};pointer-events:none;"></ha-icon>
                  <span style="pointer-events:none;">${ccuCount}</span>
                </div>
                <div class="kiosk-chip-battery"
                     onpointerdown="window._kioskLastChip='battery';window._kioskLastChipTs=Date.now();"
                     onclick="event.stopPropagation();if(window._kioskOpenBatteryModal)window._kioskOpenBatteryModal();"
                     style="${chipStyle}cursor:pointer;${battStyle}"
                     title="Batterie-Status & Wartung anzeigen">
                  <ha-icon icon="${battIcon}" style="--mdc-icon-size:16px;color:${battIconColor};pointer-events:none;"></ha-icon>
                  <span style="pointer-events:none;">${alertBatteryCount}</span>
                </div>
                <div style="${chipStyle}${paperUrgent ? 'border:1.5px solid #3498db;background:rgba(52,152,219,0.14);' : ''}" title="Tage bis Papierabholung">
                  <ha-icon icon="mdi:recycle" style="--mdc-icon-size:16px;color:#3498db;"></ha-icon>
                  <span>${paperDays}d</span>
                </div>
                <div style="${chipStyle}${wasteUrgent ? 'border:1.5px solid #e67e22;background:rgba(230,126,34,0.14);' : ''}" title="Tage bis Restmüll / Bio">
                  <ha-icon icon="mdi:trash-can-outline" style="--mdc-icon-size:16px;color:#e67e22;"></ha-icon>
                  <span>${wasteDays}d</span>
                </div>
                <div style="${chipStyle}background:${priceBg};border:${priceBorder};${priceAnim}" title="Aktueller Tibber Strompreis">
                  <ha-icon icon="${isExpensive ? 'mdi:flash-alert' : 'mdi:flash'}" style="--mdc-icon-size:16px;color:${priceColor};"></ha-icon>
                  <span style="color:${priceColor};font-weight:700;">${(price * 100).toFixed(1)} ct</span>
                </div>
              </div>
              <div style="display:inline-flex;align-items:center;gap:6px;font-size:20px;font-weight:700;color:var(--primary-text-color);padding-left:8px;flex-shrink:0;">
                <ha-icon icon="mdi:clock-outline" style="--mdc-icon-size:18px;color:var(--primary-color, #03a9f4);"></ha-icon>
                <span class="kiosk-live-clock-text">${timeStr}</span>
              </div>
            </div>
          `;
        ]]]
    tap_action:
      action: javascript
      javascript: |
        [[[
          const chip = window._kioskLastChip;
          const ts = window._kioskLastChipTs || 0;
          window._kioskLastChip = null;
          if (chip === 'ccu' && (Date.now() - ts) < 2500) {
            if (window._kioskOpenCcuModal) window._kioskOpenCcuModal();
          } else if (chip === 'battery' && (Date.now() - ts) < 2500) {
            if (window._kioskOpenBatteryModal) window._kioskOpenBatteryModal();
          }
        ]]]
    extra_styles: |
      @keyframes pulse-alert {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.5); }
        50% { transform: scale(1.04); box-shadow: 0 0 10px 3px rgba(244, 67, 54, 0.35); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
      }

