            const header = document.createElement('div');
            header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--divider-color, rgba(128,128,128,0.2));background:var(--secondary-background-color, rgba(128,128,128,0.08));';
            header.innerHTML = `
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:42px;height:42px;border-radius:12px;background:rgba(244,67,54,0.16);display:flex;align-items:center;justify-content:center;color:#f44336;">
                  <ha-icon icon="mdi:alert-circle-outline" style="--mdc-icon-size:24px;"></ha-icon>
