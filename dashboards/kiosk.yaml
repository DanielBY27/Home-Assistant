kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  nav_base:
    color_type: icon
    styles:
      card:
        - border-radius: 14px
        - border: none
        - box-shadow: none
        - transition: all 0.2s ease-in-out
      icon:
        - width: 26px
      name:
        - font-weight: 600
        - font-size: 11px
        - margin-top: 4px

  sidebar_item:
    template: nav_base
    styles:
      card:
        - width: 76px
        - height: 68px
        - background: |
            [[[
              return variables.active
                ? 'rgba(3, 169, 244, 0.18)'
                : 'var(--secondary-background-color, rgba(128, 128, 128, 0.08))';
            ]]]
        - margin: 0 auto
        - border: |
            [[[
              return variables.active
                ? '1.5px solid var(--primary-color, #03a9f4)'
                : '1px solid var(--divider-color, rgba(128, 128, 128, 0.15))';
            ]]]
      icon:
        - color: |
            [[[
              return variables.active
                ? 'var(--primary-color, #03a9f4)'
                : 'var(--secondary-text-color, #888888)';
            ]]]
      name:
        - color: |
            [[[
              return variables.active
                ? 'var(--primary-text-color)'
                : 'var(--secondary-text-color)';
            ]]]
    extra_styles: |
      @media (max-width: 768px) {
        #card {
          width: 64px !important;
          height: 52px !important;
          margin: 0 !important;
        }
        #icon {
          width: 18px !important;
        }
        #name {
          font-size: 9px !important;
          margin-top: 2px !important;
        }
      }
    tap_action:
      action: navigate
      navigation_path: '[[[ return "/dashboard-kiosk/" + variables.path ]]]'

  person_sidebar_item:
    template: sidebar_item
    show_entity_picture: true
    styles:
      card:
        - background: |
            [[[
              const isHome = entity && entity.state === 'home';
              if (variables.active) return 'rgba(3, 169, 244, 0.22)';
              if (isHome) return 'rgba(76, 175, 80, 0.14)';
              return 'var(--secondary-background-color, rgba(128, 128, 128, 0.08))';
            ]]]
        - border: |
            [[[
              const isHome = entity && entity.state === 'home';
              if (variables.active) return '1.5px solid var(--primary-color, #03a9f4)';
              if (isHome) return '1.5px solid var(--success-color, #4caf50)';
              return '1px solid var(--divider-color, rgba(128, 128, 128, 0.15))';
            ]]]
      name:
        - color: |
            [[[
              const isHome = entity && entity.state === 'home';
              if (variables.active || isHome) return 'var(--primary-text-color)';
              return 'var(--secondary-text-color)';
            ]]]
      entity_picture:
        - border-radius: 50%
        - width: 34px
        - height: 34px
        - object-fit: cover
        - margin: 0 auto
        - border: |
            [[[
              return (entity && entity.state === 'home')
                ? '2px solid var(--success-color, #4caf50)'
                : '2px solid var(--divider-color, rgba(128, 128, 128, 0.3))';
            ]]]
        - filter: |
            [[[
              return (entity && entity.state === 'home')
                ? 'none'
                : 'grayscale(100%) opacity(0.65)';
            ]]]
    custom_fields:
      presence_dot: |
        [[[
          if (entity && entity.state === 'home') {
            return '<span style="display:block;width:10px;height:10px;border-radius:50%;background:var(--success-color, #4caf50);box-shadow:0 0 6px var(--success-color, #4caf50);"></span>';
          }
          return '';
        ]]]
    extra_styles: |
      #presence_dot {
        position: absolute;
        top: 6px;
        right: 6px;
      }
      @media (max-width: 768px) {
        #card {
          width: 64px !important;
          height: 52px !important;
          margin: 0 !important;
        }
        #entity_picture {
          width: 24px !important;
          height: 24px !important;
        }
        #name {
          font-size: 9px !important;
          margin-top: 2px !important;
        }
      }

  category_item:
    template: nav_base
    styles:
      card:
        - height: 40px
        - border-radius: 20px
        - padding: 0 16px
        - background: |
            [[[
              return variables.active
                ? 'var(--primary-color, #03a9f4)'
                : 'var(--card-background-color)';
            ]]]
        - border: |
            [[[
              return variables.active
                ? 'none'
                : '1px solid var(--divider-color, rgba(128, 128, 128, 0.2))';
            ]]]
      icon:
        - color: |
            [[[
              return variables.active ? '#ffffff' : 'var(--primary-text-color)';
            ]]]
        - width: 18px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 26px 1fr
      name:
        - color: |
            [[[
              return variables.active ? '#ffffff' : 'var(--primary-text-color)';
            ]]]
        - justify-self: start
        - margin-top: 0
        - font-size: 13px
    tap_action:
      action: navigate
      navigation_path: '[[[ return "/dashboard-kiosk/" + variables.path ]]]'

  camera_card:
    aspect_ratio: 16/9
    show_entity_picture: false
    show_icon: false
    show_name: true
    styles:
      card:
        - border-radius: 18px
        - overflow: hidden
        - background: '#0b0e14'
        - padding: 0px !important
        - border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.2))
        - cursor: pointer
      grid:
        - grid-template-areas: '"live_feed"'
        - grid-template-columns: 100%
        - grid-template-rows: 100%
      name:
        - position: absolute
        - bottom: 10px
        - left: 14px
        - color: '#ffffff'
        - font-size: 13px
        - font-weight: 600
        - background: rgba(0, 0, 0, 0.55)
        - padding: 3px 10px
        - border-radius: 10px
        - backdrop-filter: blur(4px)
        - z-index: 3
    custom_fields:
      live_feed: |
        [[[
          const camId = entity ? entity.entity_id : '';
          const picUrl = (entity && entity.attributes && entity.attributes.entity_picture) ? entity.attributes.entity_picture : '';
          setTimeout(() => {
            if (!this || !this.shadowRoot || !camId) return;
            const wrap = this.shadowRoot.querySelector('.kiosk-cam-wrap');
            if (!wrap) return;
            if (wrap._inModal) return;

            const enforceCoverStyle = (sEl) => {
              if (!sEl) return;
              sEl.fitMode = 'cover';
              sEl.setAttribute('fit-mode', 'cover');
              if (sEl.shadowRoot) {
                let stTag = sEl.shadowRoot.querySelector('#kiosk-cam-cover-style');
                if (!stTag) {
                  stTag = document.createElement('style');
                  stTag.id = 'kiosk-cam-cover-style';
                  sEl.shadowRoot.appendChild(stTag);
                }
                stTag.textContent = 'video, img { width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important; }';
                const v = sEl.shadowRoot.querySelector('video');
                if (v) {
                  v.style.objectFit = 'cover';
                  v.style.width = '100%';
                  v.style.height = '100%';
                }
              }
            };

            let streamEl = wrap.querySelector('ha-camera-stream');
            if (!streamEl && hass && hass.states && hass.states[camId]) {
              streamEl = document.createElement('ha-camera-stream');
              streamEl.muted = true;
              streamEl.controls = false;
              streamEl.allowExoPlayer = true;
              streamEl.fitMode = 'cover';
              streamEl.setAttribute('fit-mode', 'cover');
              streamEl.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;background:transparent;';
              streamEl.hass = hass;
              streamEl.stateObj = hass.states[camId];
              wrap.appendChild(streamEl);
              wrap._lastStreamReset = Date.now();
              setTimeout(() => enforceCoverStyle(streamEl), 250);
              setTimeout(() => enforceCoverStyle(streamEl), 1000);
            } else if (streamEl && hass && hass.states && hass.states[camId]) {
              streamEl.hass = hass;
              streamEl.stateObj = hass.states[camId];
              enforceCoverStyle(streamEl);
            }

            if (!this._camWatchdog) {
              this._camWatchdog = setInterval(() => {
                if (!this.isConnected || !this.shadowRoot) {
                  clearInterval(this._camWatchdog);
                  this._camWatchdog = null;
                  return;
                }
                const w = this.shadowRoot.querySelector('.kiosk-cam-wrap');
                if (!w || w._inModal) return;
                const st = (this._hass && this._hass.states && this._hass.states[camId]) || (hass && hass.states && hass.states[camId]);
                const sEl = w.querySelector('ha-camera-stream');
                const nowMs = Date.now();
                if (sEl && st) {
                  enforceCoverStyle(sEl);
                  const videoEl = sEl.shadowRoot ? sEl.shadowRoot.querySelector('video') : null;
                  const streamDead = videoEl && (videoEl.ended || videoEl.error || (videoEl.readyState === 0 && (nowMs - (w._lastStreamReset || 0) > 25000)));
                  const periodicReset = (nowMs - (w._lastStreamReset || 0)) > 300000;
                  if (streamDead || periodicReset) {
                    sEl.remove();
                    const fresh = document.createElement('ha-camera-stream');
                    fresh.muted = true;
                    fresh.controls = false;
                    fresh.allowExoPlayer = true;
                    fresh.fitMode = 'cover';
                    fresh.setAttribute('fit-mode', 'cover');
                    fresh.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;background:transparent;';
                    fresh.hass = this._hass || hass;
                    fresh.stateObj = st;
                    w.appendChild(fresh);
                    w._lastStreamReset = nowMs;
                    setTimeout(() => enforceCoverStyle(fresh), 300);
                  }
                }
              }, 8000);
            }
          }, 80);
          return `
            <div class="kiosk-cam-wrap" style="position:relative;width:100%;height:100%;background:#0b0e14;overflow:hidden;">
              ${picUrl ? `<img src="${picUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;" />` : ''}
            </div>
          `;
        ]]]
      zoom_badge: |
        [[[
          return `
            <div style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.55);color:#ffffff;backdrop-filter:blur(4px);">
              <ha-icon icon="mdi:arrow-expand" style="--mdc-icon-size:16px;"></ha-icon>
            </div>
          `;
        ]]]
    extra_styles: |
      #live_feed {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      #zoom_badge {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 3;
      }
    tap_action:
      action: javascript
      javascript: |
        [[[
          if (!entity) return;
          const old = document.getElementById('kiosk-modal-overlay');
          if (old) {
            if (old._closeHandler) old._closeHandler();
            else old.remove();
          }

          const camEntity = entity.entity_id;
          const camStateObj = (hass && hass.states && hass.states[camEntity]) ? hass.states[camEntity] : entity;
          const camTitle = (variables && variables.cam_title) || (camStateObj.attributes && camStateObj.attributes.friendly_name) || camEntity;
          const basePicUrl = (camStateObj.attributes && camStateObj.attributes.entity_picture) ? camStateObj.attributes.entity_picture : '';

          const cardWrap = (this && this.shadowRoot) ? this.shadowRoot.querySelector('.kiosk-cam-wrap') : null;
          const existingStream = cardWrap ? cardWrap.querySelector('ha-camera-stream') : null;
          if (cardWrap) cardWrap._inModal = true;

          const overlay = document.createElement('div');
          overlay.id = 'kiosk-modal-overlay';
          overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:kioskFadeIn 0.18s ease-out;';

          const styleTag = document.createElement('style');
          styleTag.textContent = '@keyframes kioskFadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }';
          overlay.appendChild(styleTag);

          const modal = document.createElement('div');
          modal.style.cssText = 'width:82vw;height:82vh;max-width:1280px;max-height:920px;background:var(--card-background-color, #1c1c1e);color:var(--primary-text-color, #ffffff);border-radius:24px;border:1px solid var(--divider-color, rgba(128,128,128,0.3));box-shadow:0 24px 64px rgba(0,0,0,0.65);display:flex;flex-direction:column;overflow:hidden;position:relative;';
          modal.addEventListener('click', (e) => e.stopPropagation());

          const header = document.createElement('div');
          header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--divider-color, rgba(128,128,128,0.2));background:var(--secondary-background-color, rgba(128,128,128,0.08));';
          header.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;">
              <ha-icon icon="mdi:cctv" style="color:var(--primary-color, #03a9f4);--mdc-icon-size:24px;"></ha-icon>
              <span>${camTitle}</span>
              <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(76,175,80,0.2);color:#4caf50;border:1px solid #4caf50;">LIVE</span>
            </div>
          `;

          const closeBtn = document.createElement('button');
          closeBtn.style.cssText = 'width:40px;height:40px;border-radius:50%;border:1px solid var(--divider-color, rgba(128,128,128,0.3));background:var(--card-background-color, rgba(128,128,128,0.2));color:var(--primary-text-color, #ffffff);display:flex;align-items:center;justify-content:center;cursor:pointer;';
          closeBtn.innerHTML = '<ha-icon icon="mdi:close" style="--mdc-icon-size:22px;"></ha-icon>';

          const body = document.createElement('div');
          body.style.cssText = 'flex:1;background:#000;position:relative;overflow:hidden;width:100%;height:100%;';

          let snapInterval = null;
          if (basePicUrl) {
            const fallbackImg = document.createElement('img');
            const sep = basePicUrl.includes('?') ? '&' : '?';
            fallbackImg.src = `${basePicUrl}${sep}_t=${Date.now()}`;
            fallbackImg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none;';
            body.appendChild(fallbackImg);
            snapInterval = setInterval(() => {
              if (!overlay.isConnected) {
                clearInterval(snapInterval);
                return;
              }
              const curSt = (window._kioskLatestHass && window._kioskLatestHass.states && window._kioskLatestHass.states[camEntity]) || camStateObj;
              const curUrl = (curSt && curSt.attributes && curSt.attributes.entity_picture) ? curSt.attributes.entity_picture : basePicUrl;
              const s = curUrl.includes('?') ? '&' : '?';
              fallbackImg.src = `${curUrl}${s}_t=${Date.now()}`;
            }, 3000);
          }

          const applyModalStreamStyle = (sEl) => {
            if (!sEl) return;
            sEl.fitMode = 'contain';
            sEl.setAttribute('fit-mode', 'contain');
            sEl.controls = true;
            sEl.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;z-index:2;pointer-events:auto;background:transparent;';
            if (sEl.shadowRoot) {
              let stTag = sEl.shadowRoot.querySelector('#kiosk-cam-cover-style');
              if (!stTag) {
                stTag = document.createElement('style');
                stTag.id = 'kiosk-cam-cover-style';
                sEl.shadowRoot.appendChild(stTag);
              }
              stTag.textContent = 'video, img { width: 100% !important; height: 100% !important; object-fit: contain !important; display: block !important; }';
              const v = sEl.shadowRoot.querySelector('video');
              if (v) {
                v.style.objectFit = 'contain';
                v.style.width = '100%';
                v.style.height = '100%';
                if (v.paused && typeof v.play === 'function') {
                  v.play().catch(() => {});
                }
              }
            }
          };

          const streamEl = existingStream || document.createElement('ha-camera-stream');
          streamEl.muted = true;
          streamEl.controls = true;
          streamEl.allowExoPlayer = true;
          streamEl.hass = hass;
          streamEl.stateObj = camStateObj;
          body.appendChild(streamEl);
          applyModalStreamStyle(streamEl);
          setTimeout(() => applyModalStreamStyle(streamEl), 150);
          setTimeout(() => applyModalStreamStyle(streamEl), 600);
          setTimeout(() => applyModalStreamStyle(streamEl), 1500);

          const closeModal = () => {
            if (snapInterval) clearInterval(snapInterval);
            if (cardWrap) {
              cardWrap._inModal = false;
              if (streamEl) {
                streamEl.controls = false;
                streamEl.fitMode = 'cover';
                streamEl.setAttribute('fit-mode', 'cover');
                streamEl.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;background:transparent;';
                if (streamEl.shadowRoot) {
                  let stTag = streamEl.shadowRoot.querySelector('#kiosk-cam-cover-style');
                  if (stTag) {
                    stTag.textContent = 'video, img { width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important; }';
                  }
                  const v = streamEl.shadowRoot.querySelector('video');
                  if (v) {
                    v.style.objectFit = 'cover';
                    v.style.width = '100%';
                    v.style.height = '100%';
                    if (v.paused && typeof v.play === 'function') {
                      v.play().catch(() => {});
                    }
                  }
                }
                cardWrap.appendChild(streamEl);
              }
            }
            overlay.remove();
          };
          overlay._closeHandler = closeModal;
          closeBtn.addEventListener('click', closeModal);
          overlay.addEventListener('click', closeModal);
          header.appendChild(closeBtn);

          modal.appendChild(header);
          modal.appendChild(body);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
        ]]]

  status_chip:
    template: nav_base
    styles:
      card:
        - height: 36px
        - border-radius: 18px
        - padding: 0 12px
        - background: var(--card-background-color)
        - border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.2))
        - width: auto
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 20px auto
        - gap: 4px
      icon:
        - width: 18px
        - color: |
            [[[
              if (variables && variables.color) return variables.color;
              return 'var(--primary-text-color)';
            ]]]
      name:
        - font-size: 12px
        - font-weight: 600
        - color: var(--primary-text-color)
        - justify-self: start
        - margin-top: 0

  top_header_bar:
    triggers_update:
      - sensor.ccu3_webui_servicemeldungen
      - sensor.abholung_papier
      - sensor.abholung_restmull
      - sensor.tibber27a_strompreis
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: var(--card-background-color)
        - border-radius: 16px
        - border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.16))
        - padding: 8px 16px
        - margin: 12px 16px 6px 16px
        - box-shadow: var(--ha-card-box-shadow, none)
        - cursor: default
      grid:
        - grid-template-areas: '"header_row"'
        - grid-template-columns: 1fr
      custom_fields:
        header_row:
          - width: 100%
          - justify-self: stretch
    custom_fields:
      header_row: |
        [[[
          const ccuState = states['sensor.ccu3_webui_servicemeldungen'];
          const ccuCount = ccuState ? (parseInt(ccuState.state, 10) || 0) : 0;

          const excludeIds = new Set([
            'sensor.scb_battery_soc',
            'sensor.soc_batt_forecast',
            'sensor.rifter_ladezustand',
            'sensor.rifter_soll_ladezustand',
            'sensor.vr3ezzkxzpj688123_batterie',
            'sensor.vr3ezzkxzpj688123_service_batterie'
          ]);
          let alertBatteryCount = 0;
          Object.keys(states).forEach((id) => {
            if (excludeIds.has(id) || id.startsWith('sensor.sun2000') || id.startsWith('sensor.battery_state_of_capacity')) return;
            const s = states[id];
            if (!s || !s.attributes || s.attributes.device_class !== 'battery') return;
            if (id.startsWith('sensor.')) {
              if (s.state === 'unavailable' || s.state === 'unknown') {
                alertBatteryCount++;
              } else {
                const v = parseFloat(s.state);
                if (!isNaN(v) && v <= 20) alertBatteryCount++;
              }
            } else if (id.startsWith('binary_sensor.')) {
              if (s.state === 'on' || s.state === 'unavailable' || s.state === 'unknown') {
                alertBatteryCount++;
              }
            }
          });

          const paperState = states['sensor.abholung_papier'];
          const paperDays = paperState ? parseInt(paperState.state, 10) : '-';

          const wasteState = states['sensor.abholung_restmull'];
          const wasteDays = wasteState ? parseInt(wasteState.state, 10) : '-';

          const tibberState = states['sensor.tibber27a_strompreis'];
          const price = tibberState ? parseFloat(tibberState.state) || 0 : 0;
          const maxPrice = (tibberState && tibberState.attributes && tibberState.attributes.max_price)
            ? parseFloat(tibberState.attributes.max_price)
            : 0.30;
          const avgPrice = (tibberState && tibberState.attributes && tibberState.attributes.avg_price)
            ? parseFloat(tibberState.attributes.avg_price)
            : 0.25;
          const isExpensive = price >= (avgPrice * 1.15) || price >= (maxPrice - 0.015) || price >= 0.30;
          const priceColor = isExpensive ? '#f44336' : (price <= avgPrice ? '#4caf50' : '#ff9800');
          const priceAnim = isExpensive ? 'animation: pulse-alert 1.4s infinite ease-in-out;' : '';
          const priceBg = isExpensive ? 'rgba(244, 67, 54, 0.15)' : 'var(--secondary-background-color, rgba(128,128,128,0.1))';
          const priceBorder = isExpensive ? '1.5px solid #f44336' : '1px solid var(--divider-color, rgba(128,128,128,0.2))';

          const chipStyle = 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:16px;font-size:12px;font-weight:600;color:var(--primary-text-color);background:var(--secondary-background-color, rgba(128,128,128,0.1));border:1px solid var(--divider-color, rgba(128,128,128,0.2));user-select:none;';
          const paperUrgent = typeof paperDays === 'number' && paperDays <= 2;
          const wasteUrgent = typeof wasteDays === 'number' && wasteDays <= 2;

          window._kioskLatestHass = hass;

          window._kioskOpenCcuModal = () => {
            const old = document.getElementById('kiosk-modal-overlay');
            if (old) {
              if (old._closeHandler) old._closeHandler();
              else old.remove();
            }

            const h = window._kioskLatestHass || hass;
            const stMap = (h && h.states) ? h.states : states;
            const curCcu = stMap['sensor.ccu3_webui_servicemeldungen'];
            const curAttr = (curCcu && curCcu.attributes) ? curCcu.attributes : {};
            const msgs = [];
            Object.keys(curAttr).forEach((k) => {
              if (k.startsWith('message_') && curAttr[k]) msgs.push(curAttr[k]);
            });

            const dutySt = stMap['sensor.hmip_ccu3_001f98a99a2c7d_duty_cycle_level'];
            const csSt = stMap['sensor.hmip_ccu3_001f98a99a2c7d_carrier_sense_level'];
            const sysSt = stMap['sensor.ccu3_webui_systemzustand'];

            const overlay = document.createElement('div');
            overlay.id = 'kiosk-modal-overlay';
