            active: '[[[ return variables.active_room == "parents" ]]]'
            path: parents
          show_entity_picture: true
          styles:
            card:
              - background: |
                  [[[
                    const h1 = states['person.daniel'] && states['person.daniel'].state === 'home';
                    const h2 = states['person.tanja'] && states['person.tanja'].state === 'home';
                    if (variables.active) return 'rgba(3, 169, 244, 0.22)';
                    if (h1 || h2) return 'rgba(76, 175, 80, 0.14)';
                    return 'var(--secondary-background-color, rgba(128, 128, 128, 0.08))';
                  ]]]
              - border: |
                  [[[
                    const h1 = states['person.daniel'] && states['person.daniel'].state === 'home';
                    const h2 = states['person.tanja'] && states['person.tanja'].state === 'home';
                    if (variables.active) return '1.5px solid var(--primary-color, #03a9f4)';
                    if (h1 || h2) return '1.5px solid var(--success-color, #4caf50)';
                    return '1px solid var(--divider-color, rgba(128, 128, 128, 0.15))';
                  ]]]
            name:
              - color: |
                  [[[
                    const h1 = states['person.daniel'] && states['person.daniel'].state === 'home';
                    const h2 = states['person.tanja'] && states['person.tanja'].state === 'home';
                    if (variables.active || h1 || h2) return 'var(--primary-text-color)';
                    return 'var(--secondary-text-color)';
                  ]]]
            entity_picture:
              - border-radius: 50%
              - width: 34px
              - height: 34px
              - object-fit: cover
              - margin: 0 auto
              - border: |
                  [[[
                    const h1 = states['person.daniel'] && states['person.daniel'].state === 'home';
                    const h2 = states['person.tanja'] && states['person.tanja'].state === 'home';
                    return (h1 || h2)
                      ? '2px solid var(--success-color, #4caf50)'
                      : '2px solid var(--divider-color, rgba(128, 128, 128, 0.3))';
                  ]]]
              - filter: |
                  [[[
                    const h1 = states['person.daniel'] && states['person.daniel'].state === 'home';
                    const h2 = states['person.tanja'] && states['person.tanja'].state === 'home';
                    return (h1 || h2) ? 'none' : 'grayscale(100%) opacity(0.65)';
                  ]]]
          custom_fields:
            presence: |
              [[[
                let count = 0;
                if (states['person.daniel'] && states['person.daniel'].state === 'home') count++;
                if (states['person.tanja'] && states['person.tanja'].state === 'home') count++;
                return count > 0 ? count : '';
              ]]]
          extra_styles: |
            #presence {
              position: absolute;
