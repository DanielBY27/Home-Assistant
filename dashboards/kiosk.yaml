                  <div style="font-size:16px;font-weight:700;margin-top:2px;">${csSt ? csSt.state : '-'} %</div>
                </div>
              </div>
            `;

            const msgListHtml = msgs.length > 0
              ? msgs.map((m) => `
                  <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(244,67,54,0.1);border:1px solid rgba(244,67,54,0.35);font-size:13px;font-weight:600;">
                    <ha-icon icon="mdi:radio-tower" style="color:#f44336;--mdc-icon-size:20px;flex-shrink:0;"></ha-icon>
                    <span>${m}</span>
