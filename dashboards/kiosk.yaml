              }
              div#root > *:last-child {
                width: 100% !important;
                min-height: auto !important;
                order: 2 !important;
              }
            }
        cards:
          - type: custom:button-card
            template: sidebar_layout
            variables:
              active_room: home
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: top_header_bar
              - type: custom:button-card
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - padding: 0
                    - margin: 8px 16px 0 16px
                  grid:
                    - grid-template-areas: '"entryway backyard"'
                    - grid-template-columns: 3fr 1fr
                    - gap: 12px
                custom_fields:
                  entryway:
                    card:
                      type: custom:button-card
                      template: camera_card
                      entity: camera.entryway
                      name: Eingang
                      aspect_ratio: 21/9
                  backyard:
                    card:
                      type: custom:button-card
                      template: camera_card
                      entity: camera.backyard
                      name: Garten
                      aspect_ratio: 4/3
              - type: custom:button-card
                triggers_update: all
                styles:
                  card:
                    - background: var(--card-background-color)
                    - border-radius: 22px
                    - border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.16))
                    - padding: 20px 16px
                    - margin: 12px 16px
                    - box-shadow: var(--ha-card-box-shadow, none)
                    - position: relative
                    - overflow: hidden
                  grid:
                    - position: relative
                    - grid-template-areas: |
                        "wash dish dryer"
                        "water pv_center pv_node"
                        "power_grid car autarky_node"
                    - grid-template-columns: repeat(3, 1fr)
                    - grid-template-rows: repeat(3, minmax(92px, 1fr))
                    - gap: 22px 16px
                    - align-items: center
                    - justify-items: center
                extra_styles: |
                  #flow_svg {
                    position: absolute !important;
                    inset: 0 !important;
                    width: 100% !important;
                    height: 100% !important;
                    pointer-events: none !important;
                    z-index: 1 !important;
                  }
                  @keyframes kioskFlowParticle {
                    0% {
                      left: var(--sx);
                      top: var(--sy);
                      opacity: 0;
                      transform: translate(-50%, -50%) scale(0.65);
                    }
                    15% {
                      opacity: 1;
                      transform: translate(-50%, -50%) scale(1);
                    }
                    85% {
                      opacity: 1;
                      transform: translate(-50%, -50%) scale(1);
                    }
                    100% {
                      left: var(--ex);
                      top: var(--ey);
                      opacity: 0;
                      transform: translate(-50%, -50%) scale(0.65);
                    }
                  }
                custom_fields:
                  flow_svg: |
                    [[[
                      const getVal = (id) => states[id] ? (parseFloat(states[id].state) || 0) : 0;
                      const washW = Math.round(getVal('sensor.waschmaschine_leistung_2'));
                      const dishW = Math.round(getVal('sensor.geschirrspuler_leistung'));
                      const dryerW = Math.round(getVal('sensor.tz3000_2putqrmw_ts011f_leistung'));
                      const waterW = Math.round(getVal('sensor.heisswasser_pv_leistung'));
                      const dc1 = getVal('sensor.scb_dc1_power');
                      const dc2 = getVal('sensor.scb_dc2_power');
                      const pvSum = getVal('sensor.scb_sum_power_of_all_pv_dc_inputs');
                      const pvW = Math.round((dc1 + dc2) > 0 ? (dc1 + dc2) : pvSum);
                      const gridW = Math.round(getVal('sensor.scb_home_power_from_grid'));
                      const carW = Math.round(getVal('sensor.goe_297534_nrg_11'));
                      const homeW = Math.round(getVal('sensor.scb_home_power'));

                      // Coordinates connect the outer perimeter of the central House circle (112px -> r=56px)
                      // to the outer perimeter of each appliance/source circle (86px -> r=43px).
                      // Consumers flow outward from the House edge -> appliance edge;
                      // PV/Grid supply flows inward from the outer node edge -> House edge.
                      const lines = [
                        // Top-left: Waschmaschine (center -> 17%, 17%)
                        {
                          hx: 'calc(50% - 45px)', hy: 'calc(50% - 34px)',
                          nx: 'calc(16.67% + 35px)', ny: 'calc(16.67% + 26px)',
                          lx: '31.5%', ly: '31.5%',
                          w: washW, sign: '-', active: washW > 5, positive: false, inward: false
                        },
                        // Top-center: Geschirrspueler (center -> 50%, 17%)
                        {
                          hx: '50%', hy: 'calc(50% - 57px)',
                          nx: '50%', ny: 'calc(16.67% + 44px)',
                          lx: '50%', ly: '29.5%',
                          w: dishW, sign: '-', active: dishW > 5, positive: false, inward: false
                        },
                        // Top-right: Trockner (center -> 83%, 17%)
                        {
                          hx: 'calc(50% + 45px)', hy: 'calc(50% - 34px)',
                          nx: 'calc(83.33% - 35px)', ny: 'calc(16.67% + 26px)',
                          lx: '68.5%', ly: '31.5%',
                          w: dryerW, sign: '-', active: dryerW > 5, positive: false, inward: false
                        },
                        // Mid-left: Warmwasser (center -> 17%, 50%)
                        {
                          hx: 'calc(50% - 57px)', hy: '50%',
                          nx: 'calc(16.67% + 44px)', ny: '50%',
                          lx: '31%', ly: '50%',
                          w: waterW, sign: '-', active: waterW > 5, positive: false, inward: false
                        },
                        // Mid-right: PV-Erzeugung (83%, 50% -> center)
                        {
                          hx: 'calc(50% + 57px)', hy: '50%',
                          nx: 'calc(83.33% - 44px)', ny: '50%',
                          lx: '69%', ly: '50%',
                          w: pvW, sign: '+', active: pvW > 15, positive: true, inward: true
                        },
                        // Bottom-left: Netzbezug (17%, 83% -> center)
                        {
                          hx: 'calc(50% - 45px)', hy: 'calc(50% + 34px)',
                          nx: 'calc(16.67% + 35px)', ny: 'calc(83.33% - 26px)',
                          lx: '31.5%', ly: '68.5%',
                          w: gridW, sign: '-', active: gridW > 15, positive: false, inward: false
                        },
                        // Bottom-center: Wallbox (center -> 50%, 83%)
                        {
                          hx: '50%', hy: 'calc(50% + 57px)',
                          nx: '50%', ny: 'calc(83.33% - 44px)',
                          lx: '50%', ly: '70.5%',
                          w: carW, sign: '-', active: carW > 15, positive: false, inward: false
                        },
                        // Bottom-right: Hauslast / Autarkie (center -> 83%, 83%)
                        {
                          hx: 'calc(50% + 45px)', hy: 'calc(50% + 34px)',
                          nx: 'calc(83.33% - 35px)', ny: 'calc(83.33% - 26px)',
                          lx: '68.5%', ly: '68.5%',
                          w: homeW, sign: '-', active: homeW > 15, positive: false, inward: false
                        }
                      ];

                      // Static subtle guide tracks between perimeter of House circle and outer circles
                      const guideCoords = [
                        { x1: 37, y1: 37, x2: 24, y2: 24 },
                        { x1: 50, y1: 34, x2: 50, y2: 26 },
                        { x1: 63, y1: 37, x2: 76, y2: 24 },
                        { x1: 39, y1: 50, x2: 25, y2: 50 },
                        { x1: 61, y1: 50, x2: 75, y2: 50 },
                        { x1: 37, y1: 63, x2: 24, y2: 76 },
                        { x1: 50, y1: 66, x2: 50, y2: 74 },
                        { x1: 63, y1: 63, x2: 76, y2: 76 }
                      ];

                      const svgLines = lines.map((l, idx) => {
                        const g = guideCoords[idx];
                        const strokeColor = !l.active
                          ? 'var(--divider-color, rgba(128,128,128,0.28))'
                          : (l.positive ? 'rgba(76,175,80,0.38)' : 'rgba(255,152,0,0.38)');
                        return `<line x1="${g.x1}%" y1="${g.y1}%" x2="${g.x2}%" y2="${g.y2}%" stroke="${strokeColor}" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" vector-effect="non-scaling-stroke" />`;
                      }).join('');

                      // True circular dots (7px x 7px) starting at the outer perimeter of the House circle
                      // with calm 3.4s traversal speed
                      const htmlParticles = lines.map((l) => {
                        if (!l.active) return '';
                        const dotColor = l.positive ? '#4caf50' : '#ff9800';
                        const dotGlow = l.positive ? 'rgba(76,175,80,0.65)' : 'rgba(255,152,0,0.65)';
                        const sx = l.inward ? l.nx : l.hx;
                        const sy = l.inward ? l.ny : l.hy;
                        const ex = l.inward ? l.hx : l.nx;
                        const ey = l.inward ? l.hy : l.ny;
                        return [0, -1.13, -2.26].map((delay) => `
                          <div style="
                            position:absolute;
                            width:7px;
                            height:7px;
                            border-radius:50%;
                            background:${dotColor};
                            box-shadow:0 0 6px ${dotGlow};
                            --sx:${sx};
                            --sy:${sy};
                            --ex:${ex};
                            --ey:${ey};
                            animation:kioskFlowParticle 3.4s linear ${delay}s infinite;
                          "></div>
                        `).join('');
                      }).join('');

                      const htmlBadges = lines.map((l) => {
                        const txt = l.w > 0 ? `${l.sign}${l.w} W` : '0 W';
                        const borderCol = !l.active
                          ? 'var(--divider-color, rgba(128,128,128,0.28))'
                          : (l.positive ? '#4caf50' : '#ff9800');
                        const txtCol = !l.active
                          ? 'var(--secondary-text-color)'
                          : (l.positive ? '#4caf50' : '#ff9800');
                        return `
                          <div style="position:absolute;left:${l.lx};top:${l.ly};transform:translate(-50%,-50%);padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;background:var(--card-background-color);color:${txtCol};border:1.5px solid ${borderCol};white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.15);z-index:2;">
                            ${txt}
                          </div>
                        `;
                      }).join('');

                      return `
                        <div style="position:relative;width:100%;height:100%;">
                          <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;">
                            ${svgLines}
                          </svg>
                          ${htmlParticles}
                          ${htmlBadges}
                        </div>
                      `;
                    ]]]
