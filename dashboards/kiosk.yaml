          overlay.addEventListener('click', closeModal);

          const header = document.createElement('div');
          header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--divider-color, rgba(128,128,128,0.2));background:var(--secondary-background-color, rgba(128,128,128,0.08));';
          header.innerHTML = `
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="width:42px;height:42px;border-radius:12px;background:rgba(3,169,244,0.15);display:flex;align-items:center;justify-content:center;color:var(--primary-color, #03a9f4);">
                <ha-icon icon="${iconName}" style="--mdc-icon-size:24px;"></ha-icon>
              </div>
              <div>
                <div style="font-size:18px;font-weight:700;">${title}</div>
                <div style="font-size:12px;color:var(--secondary-text-color);">EMHASS Energiemanagement & Direktsteuerung</div>
              </div>
            </div>
          `;
          const closeBtn = document.createElement('button');
          closeBtn.style.cssText = 'width:38px;height:38px;border-radius:50%;border:1px solid var(--divider-color, rgba(128,128,128,0.3));background:var(--card-background-color);color:var(--primary-text-color);display:flex;align-items:center;justify-content:center;cursor:pointer;';
          closeBtn.innerHTML = '<ha-icon icon="mdi:close" style="--mdc-icon-size:20px;"></ha-icon>';
          closeBtn.addEventListener('click', closeModal);
          header.appendChild(closeBtn);

          const content = document.createElement('div');
          content.style.cssText = 'padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;';

          const curState = statusEntityId && states[statusEntityId] ? states[statusEntityId].state : '-';
          const curPwr = pwrSensorId && states[pwrSensorId] ? Math.round(parseFloat(states[pwrSensorId].state) || 0) : 0;
          const defPwr = deferrableId && states[deferrableId] ? Math.round(parseFloat(states[deferrableId].state) || 0) : null;

          let jsonInfoHtml = '';
          if (jsonHelperId && states[jsonHelperId] && states[jsonHelperId].state) {
            try {
              const parsed = JSON.parse(states[jsonHelperId].state);
              const ssTime = parsed.ss && parsed.ss > 0
                ? new Date(parsed.ss * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                : 'Nicht geplant';
              jsonInfoHtml = `
                <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;padding:12px;border-radius:14px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));font-size:12px;">
                  <div><span style="color:var(--secondary-text-color);display:block;">Nennleistung</span><strong>${parsed.po || 0} W</strong></div>
                  <div><span style="color:var(--secondary-text-color);display:block;">Laufzeit (Rest)</span><strong>${parsed.ho || 0} h</strong></div>
                  <div><span style="color:var(--secondary-text-color);display:block;">Geplanter Start</span><strong>${ssTime}</strong></div>
                </div>
              `;
            } catch (e) {}
          }

          if (nType === 'wallbox') {
            const carConnected = states['binary_sensor.goe_297534_car_0'] && states['binary_sensor.goe_297534_car_0'].state === 'on';
            const carSoc = states['sensor.vr3ezzkxzpj688123_batterie'] ? states['sensor.vr3ezzkxzpj688123_batterie'].state : '-';
            const neededWh = states['sensor.emhass_go_echarger_trigger'] ? Math.round(parseFloat(states['sensor.emhass_go_echarger_trigger'].state) || 0) : 0;
            jsonInfoHtml += `
              <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;padding:12px;border-radius:14px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));font-size:12px;">
                <div><span style="color:var(--secondary-text-color);display:block;">Fahrzeug</span><strong style="color:${carConnected ? '#4caf50' : 'var(--secondary-text-color)'};">${carConnected ? 'Verbunden' : 'Getrennt'}</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Auto Akku SoC</span><strong>${carSoc} %</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Ladebedarf (95%)</span><strong>${(neededWh / 1000).toFixed(1)} kWh</strong></div>
              </div>
            `;
          }

          if (nType === 'pv' || nType === 'grid' || nType === 'house') {
            const soc = states['sensor.scb_battery_soc'] ? states['sensor.scb_battery_soc'].state : '-';
            const minSoc = states['number.scb_battery_min_soc'] ? states['number.scb_battery_min_soc'].state : '-';
            const pvDc1 = states['sensor.scb_dc1_power'] ? Math.round(parseFloat(states['sensor.scb_dc1_power'].state) || 0) : 0;
            const pvDc2 = states['sensor.scb_dc2_power'] ? Math.round(parseFloat(states['sensor.scb_dc2_power'].state) || 0) : 0;
            const homePwr = states['sensor.scb_home_power'] ? Math.round(parseFloat(states['sensor.scb_home_power'].state) || 0) : 0;
            const gridPwr = states['sensor.scb_home_power_from_grid'] ? Math.round(parseFloat(states['sensor.scb_home_power_from_grid'].state) || 0) : 0;
            const battPwr = states['sensor.scb_battery_power'] ? Math.round(parseFloat(states['sensor.scb_battery_power'].state) || 0) : 0;
            const autarky = states['sensor.scb_autarky_day'] ? states['sensor.scb_autarky_day'].state : '-';
            jsonInfoHtml += `
              <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;padding:14px;border-radius:14px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));font-size:13px;">
                <div><span style="color:var(--secondary-text-color);display:block;">PV DC1 + DC2</span><strong style="color:#4caf50;">+${pvDc1 + pvDc2} W</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Hausverbrauch</span><strong>-${homePwr} W</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Netzbezug</span><strong style="color:${gridPwr > 20 ? '#f44336' : '#4caf50'};">${gridPwr > 0 ? '-' + gridPwr : '0'} W</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Haus-Akku SoC</span><strong>${soc}% (Min: ${minSoc}%)</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Akku Leistung</span><strong>${battPwr < 0 ? 'Lädt (' + Math.abs(battPwr) + ' W)' : (battPwr > 0 ? 'Entlädt (' + battPwr + ' W)' : '0 W')}</strong></div>
                <div><span style="color:var(--secondary-text-color);display:block;">Autarkie heute</span><strong>${autarky} %</strong></div>
              </div>
            `;
          }

          const priceCompareBanner = `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;background:${isExpensive ? 'rgba(244,67,54,0.14)' : 'rgba(76,175,80,0.12)'};border:1.5px solid ${isExpensive ? '#f44336' : '#4caf50'};">
              <div style="display:flex;align-items:center;gap:10px;">
                <ha-icon icon="${isExpensive ? 'mdi:flash-alert' : 'mdi:flash-check'}" style="color:${isExpensive ? '#f44336' : '#4caf50'};--mdc-icon-size:22px;"></ha-icon>
                <div>
                  <div style="font-size:13px;font-weight:700;color:${isExpensive ? '#f44336' : 'var(--primary-text-color)'};">
                    ${isExpensive
                      ? 'Achtung: Hoher Tibber-Strompreis!'
                      : 'Tibber-Strompreis aktuell günstig / normal'}
                  </div>
                  <div style="font-size:11px;color:var(--secondary-text-color);">
                    Aktuell: <strong>${(price * 100).toFixed(1)} ct/kWh</strong> &bull; Ø Heute: ${(avgPrice * 100).toFixed(1)} ct &bull; Min: ${(minPrice * 100).toFixed(1)} ct &bull; Max: ${(maxPrice * 100).toFixed(1)} ct
                  </div>
                </div>
              </div>
            </div>
          `;

          const metricsRow = `
            <div style="display:grid;grid-template-columns:repeat(${defPwr !== null ? 3 : 2}, 1fr);gap:10px;">
              <div style="padding:12px 14px;border-radius:14px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));">
                <div style="font-size:11px;color:var(--secondary-text-color);">Aktueller Status</div>
                <div style="font-size:16px;font-weight:700;margin-top:2px;">${curState}</div>
              </div>
              <div style="padding:12px 14px;border-radius:14px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));">
                <div style="font-size:11px;color:var(--secondary-text-color);">Live Leistung</div>
                <div style="font-size:16px;font-weight:700;margin-top:2px;color:${nType === 'pv' ? '#4caf50' : (curPwr > 15 ? '#ff9800' : 'var(--primary-text-color)')};">${nType === 'pv' ? '+' : (curPwr > 0 ? '-' : '')}${curPwr} W</div>
              </div>
              ${defPwr !== null ? `
                <div style="padding:12px 14px;border-radius:14px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));">
                  <div style="font-size:11px;color:var(--secondary-text-color);">EMHASS Plan-Soll</div>
                  <div style="font-size:16px;font-weight:700;margin-top:2px;">${defPwr} W</div>
                </div>
              ` : ''}
            </div>
          `;

          content.innerHTML = metricsRow + jsonInfoHtml + priceCompareBanner;

          const warnBox = document.createElement('div');
          warnBox.style.cssText = 'display:none;padding:14px 16px;border-radius:14px;background:rgba(244,67,54,0.18);border:2px solid #f44336;color:var(--primary-text-color);flex-direction:column;gap:10px;';
          content.appendChild(warnBox);

          if (statusEntityId && statusEntityId.startsWith('input_select.')) {
            const actionsTitle = document.createElement('div');
            actionsTitle.style.cssText = 'font-size:13px;font-weight:700;color:var(--secondary-text-color);margin-top:4px;';
            actionsTitle.textContent = 'Modus wählen (Force-Start prüft aktuellen Tibber-Strompreis):';
            content.appendChild(actionsTitle);

            const btnGrid = document.createElement('div');
            btnGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit, minmax(125px, 1fr));gap:10px;';

            const optionsList = (nType === 'wallbox')
              ? [
                  { opt: 'done', label: 'Stop / Fertig', icon: 'mdi:stop-circle-outline', isForce: false },
                  { opt: 'wait', label: 'EMHASS Auto', icon: 'mdi:clock-check-outline', isForce: false },
                  { opt: 'running', label: 'Eco Plan', icon: 'mdi:calendar-clock', isForce: false },
                  { opt: 'surplus', label: 'PV-Überschuss', icon: 'mdi:solar-power', isForce: false },
                  { opt: 'force-6', label: 'Force 6A (4.1 kW)', icon: 'mdi:flash', isForce: true },
                  { opt: 'force-10', label: 'Force 10A (6.9 kW)', icon: 'mdi:flash', isForce: true },
                  { opt: 'force-12', label: 'Force 12A (8.3 kW)', icon: 'mdi:flash', isForce: true },
                  { opt: 'force-14', label: 'Force 14A (9.7 kW)', icon: 'mdi:flash', isForce: true },
                  { opt: 'force-16', label: 'Force 16A (11 kW)', icon: 'mdi:flash-alert', isForce: true }
                ]
              : [
                  { opt: 'done', label: 'Fertig (Aus)', icon: 'mdi:check-circle-outline', isForce: false },
                  { opt: 'wait', label: 'EMHASS Warten', icon: 'mdi:clock-outline', isForce: false },
                  { opt: 'running', label: 'Automatik Läuft', icon: 'mdi:play-circle-outline', isForce: false },
                  { opt: 'force', label: 'Sofort Start (Force)', icon: 'mdi:flash-alert', isForce: true }
                ];

            const executeOption = (selectedOpt) => {
              hass.callService('input_select', 'select_option', {
                entity_id: statusEntityId,
                option: selectedOpt
              });
              closeModal();
            };

            optionsList.forEach((item) => {
              const isActive = curState === item.opt;
              const btn = document.createElement('button');
              const activeBorder = item.isForce ? '#f44336' : 'var(--primary-color, #03a9f4)';
              const activeBg = isActive
                ? 'rgba(3, 169, 244, 0.22)'
                : (item.isForce ? 'rgba(244, 67, 54, 0.08)' : 'var(--secondary-background-color, rgba(128,128,128,0.1))');
              btn.style.cssText = `display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;border:${isActive ? '2px solid ' + activeBorder : '1px solid var(--divider-color, rgba(128,128,128,0.25))'};background:${activeBg};color:var(--primary-text-color);font-size:13px;font-weight:600;cursor:pointer;text-align:left;`;
              btn.innerHTML = `
                <ha-icon icon="${item.icon}" style="--mdc-icon-size:20px;color:${item.isForce ? '#ff9800' : (isActive ? 'var(--primary-color, #03a9f4)' : 'var(--secondary-text-color)')};"></ha-icon>
                <span>${item.label}</span>
              `;
              btn.addEventListener('click', () => {
                if (item.isForce && (isExpensive || isNearMax || price > minPrice + 0.02)) {
                  warnBox.style.display = 'flex';
                  warnBox.innerHTML = `
                    <div style="display:flex;align-items:flex-start;gap:10px;">
                      <ha-icon icon="mdi:alert-octagon" style="color:#f44336;--mdc-icon-size:26px;flex-shrink:0;"></ha-icon>
                      <div style="font-size:13px;line-height:1.4;">
                        <strong style="color:#f44336;font-size:14px;display:block;margin-bottom:4px;">
                          Preiswarnung vor Force-Start (${item.label})
                        </strong>
                        Der aktuelle Tibber-Preis liegt bei <strong>${(price * 100).toFixed(1)} ct/kWh</strong>
                        (Tages-Minimum: ${(minPrice * 100).toFixed(1)} ct/kWh, Maximum: ${(maxPrice * 100).toFixed(1)} ct/kWh).
                        ${isExpensive ? '<strong>Der Strompreis befindet sich aktuell in der Hochpreisphase!</strong> ' : ''}
                        Möchtest du <strong>${title}</strong> trotzdem sofort im Force-Modus starten statt auf das günstigste EMHASS-Zeitfenster zu warten?
                      </div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:4px;">
                      <button id="kiosk-warn-cancel" style="padding:8px 16px;border-radius:10px;border:1px solid var(--divider-color);background:var(--card-background-color);color:var(--primary-text-color);font-weight:600;cursor:pointer;">Abbrechen (EMHASS nutzen)</button>
                      <button id="kiosk-warn-confirm" style="padding:8px 16px;border-radius:10px;border:none;background:#f44336;color:#ffffff;font-weight:700;cursor:pointer;">Trotzdem Force starten</button>
                    </div>
                  `;
                  warnBox.querySelector('#kiosk-warn-cancel').addEventListener('click', () => {
                    warnBox.style.display = 'none';
                  });
                  warnBox.querySelector('#kiosk-warn-confirm').addEventListener('click', () => {
                    executeOption(item.opt);
                  });
                } else {
                  executeOption(item.opt);
                }
              });
              btnGrid.appendChild(btn);
            });
            content.appendChild(btnGrid);
          }

          modal.appendChild(header);
          modal.appendChild(content);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
        ]]]

  sidebar_layout:
    styles:
      card:
        - background: var(--card-background-color)
        - border: none
        - border-right: 1px solid var(--divider-color, rgba(128, 128, 128, 0.18))
        - border-radius: 0
        - box-shadow: none
        - padding: 12px 6px
        - height: 100vh
      grid:
        - grid-template-areas: |
            "home"
            "wohnen"
            "kueche"
            "parents"
            "stefan"
            "simon"
            "lukas"
            "buero"
            "garage"
            "energie"
        - grid-template-columns: 1fr
        - grid-template-rows: repeat(10, minmax(60px, 1fr))
        - gap: 8px
        - align-items: center
    extra_styles: |
      @media (max-width: 768px) {
        #card {
          padding: 6px !important;
          height: auto !important;
          width: 100% !important;
          border-right: none !important;
          border-bottom: 1px solid var(--divider-color, rgba(128, 128, 128, 0.18)) !important;
        }
        #container {
          grid-template-areas: none !important;
          display: flex !important;
          flex-flow: row wrap !important;
          justify-content: space-around !important;
          gap: 6px !important;
        }
      }
    custom_fields:
      home:
        card:
          type: custom:button-card
          template: sidebar_item
          icon: mdi:home-variant
          name: Home
          variables:
            active: '[[[ return variables.active_room == "home" ]]]'
            path: home
      wohnen:
        card:
          type: custom:button-card
          template: sidebar_item
          icon: mdi:sofa
          name: Wohnen
          variables:
            active: '[[[ return variables.active_room == "wohnen" ]]]'
