                `).join('')
              : `<div style="padding:16px;border-radius:12px;background:rgba(76,175,80,0.12);border:1px solid #4caf50;color:#4caf50;font-weight:600;text-align:center;">Keine aktiven Homematic Servicemeldungen vorhanden.</div>`;

            const linkRow = document.createElement('div');
            linkRow.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;margin-top:6px;';

            const navBtn = document.createElement('button');
            navBtn.style.cssText = 'display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:none;background:var(--primary-color, #03a9f4);color:#ffffff;font-size:13px;font-weight:700;cursor:pointer;';
            navBtn.innerHTML = '<ha-icon icon="mdi:open-in-new" style="--mdc-icon-size:18px;"></ha-icon><span>Zur Homematic Detail-Seite (/homematic-config)</span>';
            navBtn.addEventListener('click', () => {
              overlay.remove();
              window.history.pushState(null, '', '/homematic-config');
