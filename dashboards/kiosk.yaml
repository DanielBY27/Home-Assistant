          const fTemp = attr.temperature !== undefined ? parseFloat(attr.temperature).toFixed(1) : '-';
          const gTemp = gTempSt && !isNaN(parseFloat(gTempSt.state)) ? parseFloat(gTempSt.state).toFixed(1) : fTemp;
          const hum = gHumSt && !isNaN(parseFloat(gHumSt.state))
            ? Math.round(parseFloat(gHumSt.state))
            : (attr.humidity !== undefined ? Math.round(attr.humidity) : '-');
          const wind = attr.wind_speed !== undefined ? parseFloat(attr.wind_speed).toFixed(1) : '-';
          const windUnit = attr.wind_speed_unit || 'm/s';
          const clouds = attr.cloud_coverage !== undefined ? Math.round(attr.cloud_coverage) : '-';

          const condMap = {
            'clear-night': { label: 'Klare Nacht', icon: 'mdi:weather-night', color: '#5c6bc0' },
            'cloudy': { label: 'Bewölkt', icon: 'mdi:weather-cloudy', color: '#90a4ae' },
            'exceptional': { label: 'Warnung', icon: 'mdi:alert-circle-outline', color: '#f44336' },
            'fog': { label: 'Nebel', icon: 'mdi:weather-fog', color: '#b0bec5' },
