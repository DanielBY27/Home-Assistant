  room_header_card:
    triggers_update: all
    show_icon: false
    show_name: false
    styles:
      card:
        - background: var(--card-background-color)
        - border-radius: 18px
        - border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.16))
        - padding: 14px 20px
        - margin: 6px 16px
        - box-shadow: var(--ha-card-box-shadow, none)
      grid:
        - grid-template-areas: '"header"'
        - grid-template-columns: 1fr
    custom_fields:
      header: |
        [[[
          const title = (variables && variables.room_title) || 'Raum';
          const subtitle = (variables && variables.room_subtitle) || '';
          const icon = (variables && variables.room_icon) || 'mdi:door-open';

          const getVal = (id) => (id && states[id] && states[id].state && states[id].state !== 'unavailable' && states[id].state !== 'unknown') ? states[id].state : null;

          const tempVal = getVal(variables && variables.temp_sensor);
          const humVal = getVal(variables && variables.hum_sensor);
          const win1 = (variables && variables.win_sensor && states[variables.win_sensor]) ? states[variables.win_sensor] : null;
          const win2 = (variables && variables.win2_sensor && states[variables.win2_sensor]) ? states[variables.win2_sensor] : null;
          const smokeSt = (variables && variables.smoke_sensor && states[variables.smoke_sensor]) ? states[variables.smoke_sensor] : null;

          const chipBase = 'display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;font-size:13px;font-weight:700;background:var(--secondary-background-color, rgba(128,128,128,0.1));border:1px solid var(--divider-color, rgba(128,128,128,0.2));color:var(--primary-text-color);';

          let chips = '';
          if (tempVal !== null) {
            chips += `
              <div style="${chipBase}">
                <ha-icon icon="mdi:thermometer" style="--mdc-icon-size:18px;color:#ff9800;"></ha-icon>
                <span>${parseFloat(tempVal).toFixed(1)} °C</span>
              </div>
            `;
          }
          if (humVal !== null) {
            chips += `
              <div style="${chipBase}">
                <ha-icon icon="mdi:water-percent" style="--mdc-icon-size:18px;color:#29b6f6;"></ha-icon>
                <span>${Math.round(parseFloat(humVal))} %</span>
              </div>
            `;
          }
          if (win1) {
            const open1 = win1.state === 'on';
            const open2 = win2 && win2.state === 'on';
            const anyOpen = open1 || open2;
            const winColor = anyOpen ? '#f44336' : '#4caf50';
            const winBg = anyOpen ? 'rgba(244,67,54,0.14)' : 'var(--secondary-background-color, rgba(128,128,128,0.1))';
            const winBorder = anyOpen ? '1.5px solid #f44336' : '1px solid var(--divider-color, rgba(128,128,128,0.2))';
            const winLabel = anyOpen ? 'Offen' : 'Geschlossen';
            chips += `
              <div style="${chipBase}background:${winBg};border:${winBorder};">
                <ha-icon icon="${anyOpen ? 'mdi:window-open-variant' : 'mdi:window-closed-variant'}" style="--mdc-icon-size:18px;color:${winColor};"></ha-icon>
                <span style="color:${anyOpen ? '#f44336' : 'var(--primary-text-color)'};">${winLabel}</span>
              </div>
            `;
          }
          if (smokeSt) {
            const isAlarm = smokeSt.state === 'on' || (smokeSt.state !== 'off' && smokeSt.state !== 'idle_off' && smokeSt.state !== 'unavailable' && smokeSt.state !== 'unknown');
            const isUnavail = smokeSt.state === 'unavailable' || smokeSt.state === 'unknown';
            const smColor = isAlarm ? '#f44336' : (isUnavail ? 'var(--secondary-text-color)' : '#4caf50');
            const smText = isAlarm ? 'ALARM' : (isUnavail ? 'Offline' : 'OK');
            chips += `
              <div style="${chipBase}${isAlarm ? 'background:rgba(244,67,54,0.18);border:1.5px solid #f44336;' : ''}" title="Rauchmelder Status">
                <ha-icon icon="mdi:smoke-detector-variant" style="--mdc-icon-size:18px;color:${smColor};"></ha-icon>
                <span>${smText}</span>
              </div>
            `;
          }

          let personHtml = '';
          const p1Id = variables && variables.person_entity;
          const p2Id = variables && variables.person2_entity;
          if (p1Id && states[p1Id]) {
            const p1 = states[p1Id];
            const isHome1 = p1.state === 'home';
            if (p2Id && states[p2Id]) {
              const p2 = states[p2Id];
              const isHome2 = p2.state === 'home';
              const anyHome = isHome1 || isHome2;
              personHtml = `
                <div style="${chipBase}border:${anyHome ? '1.5px solid #4caf50' : '1px solid var(--divider-color)'};">
                  <ha-icon icon="mdi:account-multiple" style="--mdc-icon-size:18px;color:${anyHome ? '#4caf50' : 'var(--secondary-text-color)'};"></ha-icon>
                  <span>${(isHome1 ? 1 : 0) + (isHome2 ? 1 : 0)}/2 Zuhause</span>
                </div>
              `;
            } else {
              personHtml = `
                <div style="${chipBase}border:${isHome1 ? '1.5px solid #4caf50' : '1px solid var(--divider-color)'};">
                  <ha-icon icon="mdi:account" style="--mdc-icon-size:18px;color:${isHome1 ? '#4caf50' : 'var(--secondary-text-color)'};"></ha-icon>
                  <span>${isHome1 ? 'Zuhause' : 'Unterwegs'}</span>
                </div>
              `;
            }
          }

          return `
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
              <div style="display:flex;align-items:center;gap:14px;">
                <div style="width:46px;height:46px;border-radius:14px;background:rgba(3,169,244,0.14);border:1px solid rgba(3,169,244,0.3);display:flex;align-items:center;justify-content:center;color:var(--primary-color, #03a9f4);">
                  <ha-icon icon="${icon}" style="--mdc-icon-size:26px;"></ha-icon>
                </div>
                <div style="text-align:left;">
                  <div style="font-size:20px;font-weight:800;color:var(--primary-text-color);line-height:1.2;">${title}</div>
                  ${subtitle ? `<div style="font-size:12px;color:var(--secondary-text-color);margin-top:2px;">${subtitle}</div>` : ''}
                </div>
              </div>
              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
                ${personHtml}
                ${chips}
              </div>
            </div>
          `;
        ]]]

