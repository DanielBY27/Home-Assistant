            linkRow.appendChild(navBtn);

            body.innerHTML = statsHtml + `<div style="display:flex;flex-direction:column;gap:8px;">${msgListHtml}</div>`;
            body.appendChild(linkRow);
            modal.appendChild(header);
            modal.appendChild(body);
            overlay.appendChild(modal);
