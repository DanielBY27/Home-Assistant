              - type: custom:apexcharts-card
                card_mod:
                  style: |
                    ha-card {
                      margin: 0 16px 8px 16px !important;
                      border-radius: 20px !important;
                      border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.16)) !important;
                      background: var(--card-background-color) !important;
                      box-shadow: var(--ha-card-box-shadow, none) !important;
                      padding: 4px 8px 0 8px !important;
                    }
                header:
                  show: true
                  title: Energie-Prognose (-1h bis +24h)
                  show_states: false
                  colorize_states: true
                graph_span: 25h
                span:
                  start: hour
                  offset: -1h
                now:
                  show: true
                  label: Jetzt
                  color: '#f44336'
                apex_config:
                  chart:
                    height: 175px
                    toolbar:
                      show: false
                  grid:
                    borderColor: rgba(128, 128, 128, 0.15)
                    strokeDashArray: 3
                  legend:
                    show: true
                    position: top
                    horizontalAlign: right
                    fontSize: 11px
                    labels:
                      useSeriesColors: true
                  xaxis:
                    labels:
                      datetimeUTC: false
                      format: HH:mm
                      style:
                        colors: var(--secondary-text-color)
                        fontSize: 10px
                  tooltip:
                    enabled: true
                    shared: true
                yaxis:
                  - id: power
                    min: 0
                    decimals: 0
                    apex_config:
                      tickAmount: 4
                      labels:
                        style:
                          colors: var(--secondary-text-color)
                          fontSize: 10px
                      title:
                        text: W
                        style:
                          color: var(--secondary-text-color)
                          fontSize: 10px
                  - id: price
                    opposite: true
                    decimals: 1
                    apex_config:
                      tickAmount: 4
                      labels:
                        style:
                          colors: var(--secondary-text-color)
                          fontSize: 10px
                      title:
                        text: ct/kWh
                        style:
                          color: var(--secondary-text-color)
                          fontSize: 10px
                series:
                  - entity: sensor.tibber_rohdaten_cache
                    name: Tibber (ct)
                    yaxis_id: price
                    type: line
                    curve: stepline
                    stroke_width: 2
                    color: '#e74c3c'
                    float_precision: 1
                    show:
                      legend_value: false
                      in_header: false
                    data_generator: |
                      const prices = (entity && entity.attributes && entity.attributes.price_data) ? entity.attributes.price_data : [];
                      return prices.map(item => [new Date(item.start_time).getTime(), item.price * 100]);
                  - entity: sensor.solcast_pv_forecast_prognose_heute
                    name: Solcast PV (W)
                    yaxis_id: power
                    type: area
                    curve: smooth
                    stroke_width: 2
                    color: '#ffc107'
                    opacity: 0.22
                    show:
                      legend_value: false
                      in_header: false
                    data_generator: |
                      const today = (entity && entity.attributes && entity.attributes.detailedForecast) ? entity.attributes.detailedForecast : [];
                      const tomorrowState = hass.states['sensor.solcast_pv_forecast_prognose_morgen'];
                      const tomorrow = (tomorrowState && tomorrowState.attributes && tomorrowState.attributes.detailedForecast) ? tomorrowState.attributes.detailedForecast : [];
                      return today.concat(tomorrow).map(item => [new Date(item.period_start).getTime(), Math.round(item.pv_estimate * 1000)]);
                  - entity: sensor.scb_sum_power_of_all_pv_dc_inputs
                    name: PV Ist (W)
                    yaxis_id: power
                    type: line
                    curve: smooth
                    color: '#4caf50'
                    stroke_width: 2
                    extend_to: now
                    show:
                      legend_value: false
                      in_header: false
                  - entity: sensor.scb_home_power
                    name: Hauslast (W)
                    yaxis_id: power
                    type: line
                    curve: smooth
                    color: '#03a9f4'
                    stroke_width: 1.5
                    extend_to: now
                    show:
                      legend_value: false
                      in_header: false
