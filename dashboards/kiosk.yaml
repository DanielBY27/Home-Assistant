  energy_node_card:
    template: nav_base
    triggers_update: all
    show_name: true
    show_label: true
    styles:
      card:
        - width: 86px
        - height: 86px
        - border-radius: 50%
        - padding: 4px
        - z-index: 2
        - cursor: pointer
        - background: |
            [[[
              const nType = (variables && variables.node_type) || 'appliance';
              const pwrEntity = variables && variables.power_sensor ? states[variables.power_sensor] : null;
              const pwr = pwrEntity ? (parseFloat(pwrEntity.state) || 0) : 0;
              const s = entity ? entity.state : 'done';
              if (nType === 'pv') {
                return pwr > 15
                  ? 'radial-gradient(circle, rgba(76, 175, 80, 0.24) 0%, var(--card-background-color) 85%)'
                  : 'var(--card-background-color)';
              }
              if (nType === 'grid') {
                return pwr > 15
                  ? 'radial-gradient(circle, rgba(244, 67, 54, 0.22) 0%, var(--card-background-color) 85%)'
                  : 'var(--card-background-color)';
              }
              if (s === 'running' || s.startsWith('force') || s === 'surplus') {
                return 'radial-gradient(circle, rgba(76, 175, 80, 0.24) 0%, var(--card-background-color) 85%)';
              }
              if (s === 'wait') {
                return 'radial-gradient(circle, rgba(255, 193, 7, 0.22) 0%, var(--card-background-color) 85%)';
              }
              return 'var(--card-background-color)';
            ]]]
        - border: |
            [[[
              const nType = (variables && variables.node_type) || 'appliance';
              const pwrEntity = variables && variables.power_sensor ? states[variables.power_sensor] : null;
              const pwr = pwrEntity ? (parseFloat(pwrEntity.state) || 0) : 0;
              const s = entity ? entity.state : 'done';
              if (nType === 'pv') {
                return pwr > 15 ? '2px solid #4caf50' : '1.5px solid var(--divider-color, rgba(128,128,128,0.28))';
              }
              if (nType === 'grid') {
                return pwr > 15 ? '2px solid #f44336' : '1.5px solid var(--divider-color, rgba(128,128,128,0.28))';
              }
              if (s.startsWith('force')) return '2px solid #03a9f4';
              if (s === 'running' || s === 'surplus') return '2px solid #4caf50';
              if (s === 'wait') return '2px solid #ffc107';
              return '1.5px solid var(--divider-color, rgba(128,128,128,0.28))';
            ]]]
        - box-shadow: |
            [[[
              const nType = (variables && variables.node_type) || 'appliance';
              const pwrEntity = variables && variables.power_sensor ? states[variables.power_sensor] : null;
              const pwr = pwrEntity ? (parseFloat(pwrEntity.state) || 0) : 0;
              const s = entity ? entity.state : 'done';
              if ((nType === 'pv' && pwr > 50) || s === 'running' || s === 'surplus') {
                return '0 0 14px rgba(76, 175, 80, 0.35)';
              }
              if (s.startsWith('force')) {
                return '0 0 14px rgba(3, 169, 244, 0.35)';
              }
              if (nType === 'grid' && pwr > 500) {
                return '0 0 14px rgba(244, 67, 54, 0.3)';
              }
              return '0 4px 10px rgba(0, 0, 0, 0.12)';
            ]]]
      grid:
        - grid-template-areas: '"i" "n" "l"'
