                <div style="padding:10px 14px;border-radius:12px;background:var(--secondary-background-color, rgba(128,128,128,0.08));border:1px solid var(--divider-color, rgba(128,128,128,0.16));">
                  <div style="font-size:11px;color:var(--secondary-text-color);">Duty Cycle</div>
                  <div style="font-size:16px;font-weight:700;margin-top:2px;">${dutySt ? dutySt.state : '-'} %</div>
