  room_device_card:
    triggers_update: all
    show_icon: false
    show_name: false
    styles:
      card:
        - background: var(--card-background-color)
        - border-radius: 18px
        - border: 1px solid var(--divider-color, rgba(128, 128, 128, 0.16))
        - padding: 14px 16px
        - box-shadow: var(--ha-card-box-shadow, none)
        - cursor: pointer
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
    custom_fields:
      body: |
        [[[
          const name = (variables && variables.dev_name) || (entity && entity.attributes && entity.attributes.friendly_name) || 'Gerät';
          const icon = (variables && variables.dev_icon) || 'mdi:power-plug';
          const st = entity ? entity.state : 'unknown';
          const isOn = st === 'on' || st === 'playing' || st === 'cleaning' || st === 'running' || st.startsWith('force') || st === 'surplus' || st === 'wait';
          const pwrSt = (variables && variables.power_sensor && states[variables.power_sensor]) ? states[variables.power_sensor] : null;
          const pwr = pwrSt && !isNaN(parseFloat(pwrSt.state)) ? Math.round(parseFloat(pwrSt.state)) : null;
          const subSensorSt = (variables && variables.sub_sensor && states[variables.sub_sensor]) ? states[variables.sub_sensor] : null;
          const subUnit = (variables && variables.sub_unit) || '';

          let stateText = st;
          if (st === 'on') stateText = 'Eingeschaltet';
          else if (st === 'off') stateText = 'Ausgeschaltet';
          else if (st === 'done') stateText = 'Bereit / Fertig';
          else if (st === 'wait') stateText = 'EMHASS Geplant';
          else if (st === 'running') stateText = 'Aktiv / Läuft';
          else if (st === 'surplus') stateText = 'PV-Überschuss';
          else if (st.startsWith('force')) stateText = `Sofortladen (${st.toUpperCase()})`;
          else if (st === 'docked') stateText = 'In Ladestation';
          else if (st === 'cleaning') stateText = 'Reinigt';
          else if (st === 'idle') stateText = 'Bereit';
          else if (st === 'playing') stateText = 'Aktiv / Wiedergabe';
          else if (st === 'unavailable') stateText = 'Offline';

          const details = [];
          if (pwr !== null) details.push(`${pwr} W`);
          if (subSensorSt && subSensorSt.state !== 'unavailable' && subSensorSt.state !== 'unknown') {
            details.push(`${subSensorSt.state}${subUnit}`);
          }

          const accent = isOn ? 'var(--primary-color, #03a9f4)' : 'var(--secondary-text-color)';
          const bgIcon = isOn ? 'rgba(3, 169, 244, 0.16)' : 'var(--secondary-background-color, rgba(128, 128, 128, 0.12))';

          return `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                <div style="width:42px;height:42px;border-radius:12px;background:${bgIcon};display:flex;align-items:center;justify-content:center;color:${accent};flex-shrink:0;">
                  <ha-icon icon="${icon}" style="--mdc-icon-size:22px;"></ha-icon>
                </div>
                <div style="text-align:left;overflow:hidden;">
                  <div style="font-size:14px;font-weight:700;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
                  <div style="font-size:12px;color:${isOn ? accent : 'var(--secondary-text-color)'};font-weight:600;">
                    ${stateText}${details.length > 0 ? ' &bull; ' + details.join(' &bull; ') : ''}
                  </div>
                </div>
              </div>
              <ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:20px;color:var(--secondary-text-color);flex-shrink:0;"></ha-icon>
            </div>
          `;
        ]]]
    tap_action:
      action: more-info

views:
  - title: Home
