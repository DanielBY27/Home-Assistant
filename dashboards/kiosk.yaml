      icon:
        - width: 26px
        - color: |
            [[[
              const nType = (variables && variables.node_type) || 'appliance';
              const pwrEntity = variables && variables.power_sensor ? states[variables.power_sensor] : null;
              const pwr = pwrEntity ? (parseFloat(pwrEntity.state) || 0) : 0;
              const s = entity ? entity.state : 'done';
              if (nType === 'pv') return pwr > 15 ? '#4caf50' : 'var(--secondary-text-color)';
              if (nType === 'grid') return pwr > 15 ? '#f44336' : 'var(--secondary-text-color)';
              if (s.startsWith('force')) return '#03a9f4';
              if (s === 'running' || s === 'surplus') return '#4caf50';
              if (s === 'wait') return '#ffc107';
              return 'var(--secondary-text-color)';
            ]]]
        - animation: |
            [[[
              const nType = (variables && variables.node_type) || 'appliance';
              const pwrEntity = variables && variables.power_sensor ? states[variables.power_sensor] : null;
              const pwr = pwrEntity ? (parseFloat(pwrEntity.state) || 0) : 0;
              const s = entity ? entity.state : 'done';
              if (nType === 'appliance' && (s === 'running' || s.startsWith('force')) && pwr > 10) {
                return 'nodePulse 1.8s infinite ease-in-out';
              }
              if (nType === 'pv' && pwr > 100) {
                return 'nodePulse 2.4s infinite ease-in-out';
              }
